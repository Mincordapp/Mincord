# A stable release, built from a tag: push `v0.1.0`, or Actions > Release >
# Run workflow with an existing tag. It builds the Linux AppImage, the Arch
# package and the Windows ZIP as the nightly does, compiles the Windows
# installer on a Windows runner, since Inno Setup's Wine run doesn't start on
# the Linux ones, and publishes them as the latest release. See
# docs/packaging.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The tag names the version the tree already carries: a release is
          # built from what scripts/set-version committed, never stamped here.
          # Cargo.toml's lines end in CRLF, which the pattern allows for.
          current=$(sed -n 's/^version = "\(.*\)"\r\?$/\1/p' Cargo.toml | head -1)
          if [ "$current" != "$version" ]; then
            echo "::error::$tag names $version, but Cargo.toml is at $current. Run scripts/set-version $version, commit and tag again."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      # The AppImage's binary as an Arch package, in an Arch container.
      - run: scripts/package-arch
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/linux/Mincord-*
            target/dist/linux/mincord-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it. The same
      # keys the nightly writes, so a release restores what it left.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      # The compiled dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so the
      # installer is compiled in the job below instead.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Mincord-*
          if-no-files-found: error
          compression-level: 0

  installer:
    needs: [version, windows]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The compiler scripts/package-windows.py runs under Wine, pinned the
      # same way; keep the two in step.
      INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
      INNO_SETUP_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
    steps:
      # packaging/windows/mincord.iss, its icon beside it, and the LICENSE the
      # wizard shows.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Install Inno Setup
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile innosetup.exe
          $digest = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne $env:INNO_SETUP_SHA256) { throw "Inno Setup is $digest, not $env:INNO_SETUP_SHA256" }
          $arguments = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/DIR=C:\InnoSetup', '/NOICONS'
          $run = Start-Process -Wait -PassThru -FilePath .\innosetup.exe -ArgumentList $arguments
          if ($run.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($run.ExitCode)" }
      # Over the ZIP's own files, so the installer and the portable package
      # carry the same build, as scripts/package-windows.py compiles it.
      - name: Compile the installer
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "dist\Mincord-$env:VERSION-windows-x64.zip" -DestinationPath package
          $source = (Resolve-Path "package\Mincord-$env:VERSION-windows-x64").Path
          New-Item -ItemType Directory installer | Out-Null
          $output = (Resolve-Path installer).Path
          $license = (Resolve-Path LICENSE).Path
          # The file's version resource takes only numbers, without a suffix.
          $number = $env:VERSION.Split('-')[0]
          & C:\InnoSetup\ISCC.exe /Q "/DAppVersion=$env:VERSION" "/DVersionNumber=$number" `
            "/DSourceDir=$source" "/DLicenseFile=$license" "/O$output" packaging\windows\mincord.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Mincord-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [version, linux, windows, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      # Only for the notes' jq program.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        run: |
          # A failed request must fail the job, not leave the list empty.
          set -o pipefail
          # Both build jobs zip the commit's source; SOURCE.txt and each
          # BUILD.json name the one file the release carries.
          cmp "dist/linux/Mincord-$VERSION-source.zip" "dist/windows/Mincord-$VERSION-source.zip"
          mkdir release
          mv dist/linux/Mincord-* dist/linux/mincord-*.pkg.tar.zst release/
          mv dist/windows/Mincord-*-windows-x64* release/
          mv dist/installer/Mincord-*-windows-x64-setup.exe release/
          (cd release && sha256sum Mincord-* mincord-*.pkg.tar.zst > SHA256SUMS.txt)
          # The newest stable release; a nightly is a prerelease, and left out.
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          {
            echo "Mincord $VERSION."
            echo
            echo "- Windows: \`Mincord-$VERSION-windows-x64-setup.exe\` installs for you alone, without administrator rights, and updates itself from here. \`Mincord-$VERSION-windows-x64.zip\` is the same build, portable."
            echo "- Linux: \`Mincord-$VERSION-x86_64.AppImage\`, which AppImageUpdate and Gear Lever follow through its \`.zsync\` file. On Arch Linux, install the \`.pkg.tar.zst\` with \`sudo pacman -U\` and its link."
            echo "- \`Mincord-$VERSION-source.zip\` is this build's source, and \`SHA256SUMS.txt\` the checksums of every file here."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              # The API lists at most 250 commits; the link below has them all.
              gh api "repos/$GH_REPO/compare/$previous...$COMMIT" | jq -r -f .github/nightly-notes.jq
              echo "All changes: https://github.com/$GH_REPO/compare/$previous...$COMMIT"
            fi
          } > notes.md
          gh release create "$TAG" release/* --latest --verify-tag \
            --title "Mincord $VERSION" --notes-file notes.md
